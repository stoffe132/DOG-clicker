<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Dog Clicker</title>

<style>
body{margin:0;background:#111;color:#fff;font-family:Arial;text-align:center}
#count{font-size:40px;margin:20px 0}
#idle{font-size:20px;margin-bottom:10px;color:#ccc}
img{width:300px;cursor:pointer;user-select:none;transition:transform 0.1s}
#upgrades{max-height:600px;overflow-y:auto;margin:10px auto;width:220px;text-align:center}
button{margin:5px;padding:10px 16px;font-size:16px;width:200px;display:block;margin-left:auto;margin-right:auto}
#resetBtn{position:fixed;top:20px;left:20px;width:auto !important;display:inline-block !important;padding:10px 16px;z-index:9999}
</style>

</head>
<body>

<h1>Dog Clicker</h1>

<div id="count">0</div>
<div id="idle">Idle: 0/sek</div>

<img id="dog" src="dog.jpg">

<br>

<button id="resetBtn">Radera data</button>

<div id="upgrades"></div>

<audio id="clickSound" src="click.mp3"></audio>
<audio id="buySound" src="buy.mp3"></audio>

<script>

// sparade värden
let count = BigInt(localStorage.getItem("count") || 0)
let clickPower = BigInt(localStorage.getItem("clickPower") || 1)
let passive = BigInt(localStorage.getItem("passive") || 0)

const countEl = document.getElementById("count")
const idleEl = document.getElementById("idle")
const dog = document.getElementById("dog")
const upgradesContainer = document.getElementById("upgrades")

const clickSound = document.getElementById("clickSound")
const buySound = document.getElementById("buySound")

let upgrades = []

// nummerförkortning
function formatNumber(num){

  const units=[
    {v:1000000000000n,s:"T"},
    {v:1000000000n,s:"B"},
    {v:1000000n,s:"M"},
    {v:1000n,s:"K"}
  ]

  for(let u of units){
    if(num>=u.v){
      let whole=num/u.v
      let decimal=(num%u.v)*10n/u.v
      return whole.toString()+"."+decimal.toString()+u.s
    }
  }

  return num.toString()
}

// klickkraft upgrade
upgrades.push({
  name:"Klickkraft +1",
  cost:50n,
  multiplier:115n,
  effect:()=>{clickPower+=1n}
})

// passiva upgrades
let baseCost=100n
let basePassive=1n

for(let i=0;i<49;i++){

  let income=basePassive

  upgrades.push({
    name:`+${income}/sek`,
    cost:baseCost,
    multiplier:125n,
    effect:()=>{passive+=income}
  })

  baseCost=baseCost*250n/100n
  basePassive*=2n
}

// skapa knappar
upgrades.forEach((u,index)=>{

  let btn=document.createElement("button")
  btn.id="upgrade"+index

  btn.textContent=`${u.name} (kostar ${formatNumber(u.cost)})`

  btn.onclick=()=>{

    if(count>=u.cost){

      count-=u.cost

      u.effect()

      u.cost=u.cost*u.multiplier/100n

      btn.textContent=`${u.name} (kostar ${formatNumber(u.cost)})`

      buySound.currentTime=0
      buySound.play()

      updateDisplay()
      save()

    }

  }

  upgradesContainer.appendChild(btn)

})

// klick
dog.onclick=()=>{

  count+=clickPower

  clickSound.currentTime=0
  clickSound.play()

  dog.style.transform="scale(1.1)"

  setTimeout(()=>dog.style.transform="scale(1)",100)

  updateDisplay()

}

// passiv inkomst
setInterval(()=>{

  count+=passive

  updateDisplay()
  save()

},1000)

// reset
document.getElementById("resetBtn").onclick=()=>{

  localStorage.clear()
  location.reload()

}

// display
function updateDisplay(){

  countEl.textContent=formatNumber(count)

  idleEl.textContent =
    passive>0n
    ? `Idle: ${formatNumber(passive)}/sek`
    : "Ingen passiv inkomst"

}

// spara
function save(){

  localStorage.setItem("count",count.toString())
  localStorage.setItem("clickPower",clickPower.toString())
  localStorage.setItem("passive",passive.toString())

}

updateDisplay()

</script>

</body>
</html>

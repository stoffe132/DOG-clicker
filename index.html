<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Dog Clicker</title>

<style>
body{margin:0;background:#111;color:#fff;font-family:Arial;text-align:center}
#count{font-size:40px;margin:20px 0}
#idle{font-size:20px;margin-bottom:10px;color:#ccc}
img{width:300px;cursor:pointer;user-select:none;transition:transform 0.1s}
#upgrades{max-height:600px;overflow-y:auto;margin:10px auto;width:220px;text-align:center}
button{margin:5px;padding:10px 16px;font-size:16px;width:200px;display:block;margin-left:auto;margin-right:auto;cursor:pointer}
button:disabled{opacity:0.5;cursor:not-allowed}
#resetBtn{position:fixed;top:20px;left:20px;width:auto !important;display:inline-block !important;padding:10px 16px;z-index:9999}
</style>

</head>
<body>

<h1>Dog Clicker</h1>

<div id="count">0</div>
<div id="idle">Idle: 0/sek</div>

<img id="dog" src="dog.jpg">

<br>

<button id="resetBtn">Radera data</button>

<div id="upgrades"></div>

<audio id="clickSound" src="click.mp3"></audio>
<audio id="buySound" src="buy.mp3"></audio>

<script>

// Ladda sparade grundvärden
let count = BigInt(localStorage.getItem("count") || 0);
let clickPower = BigInt(localStorage.getItem("clickPower") || 1);
let passive = BigInt(localStorage.getItem("passive") || 0);

// Hämta sparade priser för uppgraderingar om de finns
let savedCosts = JSON.parse(localStorage.getItem("upgradeCosts") || "[]");

const countEl = document.getElementById("count");
const idleEl = document.getElementById("idle");
const dog = document.getElementById("dog");
const upgradesContainer = document.getElementById("upgrades");

const clickSound = document.getElementById("clickSound");
const buySound = document.getElementById("buySound");

let upgrades = [];

// Nummerförkortning
function formatNumber(num){
  const units=[
    {v:1000000000000n,s:"T"},
    {v:1000000000n,s:"B"},
    {v:1000000n,s:"M"},
    {v:1000n,s:"K"}
  ];

  for(let u of units){
    if(num>=u.v){
      let whole=num/u.v;
      let decimal=(num%u.v)*10n/u.v;
      return whole.toString()+"."+decimal.toString()+u.s;
    }
  }
  return num.toString();
}

// 1. Skapa Klickkraft-uppgraderingen
upgrades.push({
  name:"Klickkraft +1",
  cost: savedCosts[0] ? BigInt(savedCosts[0]) : 50n,
  multiplier:115n,
  effect:()=>{clickPower+=1n}
});

// 2. Skapa de passiva uppgraderingarna
let baseCost=100n;
let basePassive=1n;

for(let i=0;i<49;i++){
  let income=basePassive;
  let savedCostIndex = i + 1; // Index 0 är klickkraft

  upgrades.push({
    name:`+${income}/sek`,
    cost: savedCosts[savedCostIndex] ? BigInt(savedCosts[savedCostIndex]) : baseCost,
    multiplier:125n,
    effect:()=>{passive+=income}
  });

  baseCost=baseCost*250n/100n;
  basePassive*=2n;
}

// Skapa knappar i DOM och spara referenser till dem
let upgradeButtons = [];

upgrades.forEach((u,index)=>{
  let btn=document.createElement("button");
  btn.id="upgrade"+index;
  btn.textContent=`${u.name} (kostar ${formatNumber(u.cost)})`;

  btn.onclick=()=>{
    if(count>=u.cost){
      count-=u.cost;
      u.effect();
      u.cost=u.cost*u.multiplier/100n;

      btn.textContent=`${u.name} (kostar ${formatNumber(u.cost)})`;

      try {
        buySound.currentTime=0;
        buySound.play();
      } catch(e) {}

      updateDisplay();
      save();
    }
  };

  upgradesContainer.appendChild(btn);
  upgradeButtons.push({ element: btn, upgrade: u });
});

// Klick på hunden
dog.onclick=()=>{
  count+=clickPower;

  try {
    clickSound.currentTime=0;
    clickSound.play();
  } catch(e) {}

  dog.style.transform="scale(1.1)";
  setTimeout(()=>dog.style.transform="scale(1)",100);

  updateDisplay();
  save(); // Sparar direkt vid klick så man inte förlorar poäng
};

// Passiv inkomst (Körs varje sekund)
setInterval(()=>{
  count+=passive;
  updateDisplay();
  save();
},1000);

// Nollställ spel
document.getElementById("resetBtn").onclick=()=>{
  localStorage.clear();
  location.reload();
};

// Uppdatera gränssnittet
function updateDisplay(){
  countEl.textContent=formatNumber(count);

  idleEl.textContent =
    passive>0n
    ? `Idle: ${formatNumber(passive)}/sek`
    : "Ingen passiv inkomst";

  // Gråa ut knappar som spelaren inte har råd med
  upgradeButtons.forEach(item => {
    item.element.disabled = (count < item.upgrade.cost);
  });
}

// Spara all data
function save(){
  localStorage.setItem("count",count.toString());
  localStorage.setItem("clickPower",clickPower.toString());
  localStorage.setItem("passive",passive.toString());
  
  // Spara alla dynamiska priser som en array av strängar
  let costsToSave = upgrades.map(u => u.cost.toString());
  localStorage.setItem("upgradeCosts", JSON.stringify(costsToSave));
}

// Körs vid start
updateDisplay();

</script>

</body>
</html>
